<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link
    rel="stylesheet"
    type="text/css"
    href="https://cdn.jsdelivr.net/npm/pikaday/css/pikaday.css"
  />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: visible;
      font-family: "Baskerville Display PT", Baskerville, "Libre Baskerville", Georgia, serif;
      color: #000000;
    }

    #hotel-booking-widget,
    #hotel-booking-widget * {
      box-sizing: border-box;
    }

    #hotel-booking-widget {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0;
      background: transparent;
      color: #000000;
      border: none;
      box-shadow: none;
      overflow: visible;
    }

    #hotel-booking-widget input,
    #hotel-booking-widget button,
    #hotel-booking-widget select {
      font-family: "Baskerville Display PT", Baskerville, "Libre Baskerville", Georgia, serif !important;
    }

    #hotel-booking-widget .hb-form {
      display: grid;
      grid-template-columns: 1.3fr 1.3fr 0.75fr 0.75fr auto;
      gap: 26px;
      align-items: end;
      width: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      overflow: visible;
    }

    #hotel-booking-widget .hb-block,
    #hotel-booking-widget .hb-block-counters {
      display: contents;
    }

    #hotel-booking-widget .hb-group,
    #hotel-booking-widget .hb-group-right {
      margin: 0;
      padding: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      overflow: visible;
    }

    #hotel-booking-widget .hb-title {
      margin: 0 0 8px 0 !important;
      padding: 0 !important;
      text-align: left;
      font-size: 1em;
      line-height: 1.2;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      color: #000000;
      opacity: 1;
    }

    #hotel-booking-widget .hb-date-field {
      width: 100% !important;
      height: 36px !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
      border-bottom: 1.5px solid #000000 !important;
      border-radius: 0 !important;
      background: transparent !important;
      color: #000000 !important;
      font-size: 1em !important;
      line-height: 36px !important;
      font-weight: 400 !important;
      text-align: left;
      cursor: pointer;
      box-shadow: none !important;
      outline: none !important;
    }

    #hotel-booking-widget .hb-date-field:hover {
      opacity: 0.75;
    }

    #hotel-booking-widget .hb-date-field:focus-visible {
      outline: none !important;
      border-bottom-width: 2px !important;
    }

    #hotel-booking-widget .hb-counter {
      margin: 0;
      padding: 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    #hotel-booking-widget .hb-counter-inner {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      height: 36px;
      border: none;
      border-bottom: 1.5px solid #000000;
      background: transparent;
      box-shadow: none;
    }

    #hotel-booking-widget .hb-count-button {
      width: auto !important;
      height: 36px !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      background: transparent !important;
      color: #000000 !important;
      font-size: 1em !important;
      font-weight: 400 !important;
      line-height: 36px !important;
      text-align: center !important;
      cursor: pointer;
      box-shadow: none !important;
      outline: none !important;
    }

    #hotel-booking-widget .hb-count-button:hover {
      opacity: 0.55;
    }

    #hotel-booking-widget .hb-count-field {
      width: 100%;
      height: 36px;
      padding: 0;
      margin: 0;
      border: none;
      background: transparent;
      color: #000000;
      font-size: 1em;
      font-weight: 400;
      line-height: 36px;
      text-align: center;
      box-shadow: none;
      outline: none;
    }

    #hotel-booking-widget .hb-submit-block {
      margin: 0;
      padding: 0;
      align-self: end;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    #hotel-booking-widget .hb-submit-button {
      min-width: 210px !important;
      height: 44px !important;
      padding: 0 24px !important;
      margin: 0 !important;
      border: 1.5px solid #000000 !important;
      border-radius: 0 !important;
      background: transparent !important;
      color: #000000 !important;
      font-size: 1em !important;
      font-weight: 400 !important;
      letter-spacing: 0 !important;
      text-transform: none !important;
      line-height: 42px !important;
      text-align: center !important;
      cursor: pointer;
      box-shadow: none !important;
      outline: none !important;
      appearance: none !important;
      -webkit-appearance: none !important;
    }

    #hotel-booking-widget .hb-submit-button:hover {
      background: #000000 !important;
      color: #FEFAF1 !important;
      border-color: #000000 !important;
    }

    #hotel-booking-widget .hb-submit-button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    #hotel-booking-widget .hb-warning {
      color: #9f1d1d;
      font-weight: 400;
      margin-top: 12px;
      min-height: 1.2em;
      text-align: left;
      font-size: 1em;
    }

    #hotel-booking-widget .hb-children-wrap {
      position: relative;
      overflow: visible;
    }

    #hotel-booking-widget .hb-selects {
      display: none;
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      z-index: 999999;
      width: 300px;
      padding: 16px;
      background: #FEFAF1;
      border: 1px solid #000000;
      color: #000000;
      box-shadow: none;
      overflow: visible;
      box-sizing: border-box;
    }

    #hotel-booking-widget .hb-select-group {
      display: none;
      width: 100%;
      padding: 0;
      margin-bottom: 12px;
      background: transparent;
    }

    #hotel-booking-widget .hb-select-group:last-child {
      margin-bottom: 0;
    }

    #hotel-booking-widget .hb-select {
      width: 100%;
      height: 44px;
      padding: 0 10px !important;
      border: 1px solid #000000;
      border-radius: 0 !important;
      background: #FEFAF1;
      color: #000000;
      font-size: 1em;
      font-weight: 400;
      appearance: auto;
      box-sizing: border-box;
    }

    #hotel-booking-widget input::-webkit-outer-spin-button,
    #hotel-booking-widget input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    #hotel-booking-widget input[type="number"] {
      -moz-appearance: textfield;
    }

    .hotel-booking-pika {
      font-family: "Baskerville Display PT", Baskerville, "Libre Baskerville", Georgia, serif !important;
      z-index: 999999 !important;
      border: 1px solid #000000 !important;
      background: #FEFAF1 !important;
      color: #000000 !important;
      box-shadow: none !important;
    }

    .hotel-booking-pika .pika-lendar,
    .hotel-booking-pika .pika-label,
    .hotel-booking-pika .pika-table th,
    .hotel-booking-pika .pika-button {
      background: #FEFAF1 !important;
      color: #000000 !important;
      font-family: "Baskerville Display PT", Baskerville, "Libre Baskerville", Georgia, serif !important;
      font-weight: 400 !important;
    }

    .hotel-booking-pika .is-today .pika-button {
      color: #000000 !important;
      font-weight: 700 !important;
    }

    .hotel-booking-pika .is-selected .pika-button,
    .hotel-booking-pika .has-event .pika-button {
      color: #FEFAF1 !important;
      font-weight: 700 !important;
      background: #000000 !important;
      box-shadow: none !important;
    }

    .hotel-booking-pika .pika-button:hover,
    .hotel-booking-pika .pika-row.pick-whole-week:hover .pika-button {
      color: #FEFAF1 !important;
      background: #000000 !important;
    }

    @media only screen and (max-width: 1100px) {
      #hotel-booking-widget .hb-form {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }

      #hotel-booking-widget .hb-submit-block {
        grid-column: 1 / -1;
      }

      #hotel-booking-widget .hb-submit-button {
        width: 100% !important;
      }
    }

    @media only screen and (max-width: 640px) {
      #hotel-booking-widget .hb-form {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      #hotel-booking-widget .hb-submit-button {
        width: 100% !important;
      }

      #hotel-booking-widget .hb-selects {
        position: static;
        width: 100%;
        margin-top: 12px;
      }
    }
  </style>
</head>

<body>
  <div id="hotel-booking-widget">
    <form class="hb-form" id="hotel-booking-form" novalidate>
      <div class="hb-block">
        <div class="hb-group">
          <h4 class="hb-title">
            <label for="hb-date-from">Dátum príchodu</label>
          </h4>

          <input
            class="hb-date-field"
            type="text"
            autocomplete="off"
            id="hb-date-from"
            name="dateFrom"
            readonly
          />
        </div>

        <div class="hb-group-right">
          <h4 class="hb-title">
            <label for="hb-date-to">Dátum odchodu</label>
          </h4>

          <input
            class="hb-date-field"
            type="text"
            autocomplete="off"
            id="hb-date-to"
            name="dateTo"
            readonly
          />
        </div>
      </div>

      <div class="hb-block hb-block-counters">
        <div class="hb-group">
          <div class="hb-counter">
            <h4 class="hb-title">
              <label for="hb-adults">Dospelí</label>
            </h4>

            <div class="hb-counter-inner">
              <button class="hb-count-button" type="button" data-counter="adults" data-direction="remove">-</button>

              <input
                class="hb-count-field"
                id="hb-adults"
                autocomplete="off"
                type="number"
                name="adults"
                readonly
              />

              <button class="hb-count-button" type="button" data-counter="adults" data-direction="add">+</button>
            </div>
          </div>
        </div>

        <div class="hb-group-right hb-children-wrap">
          <div class="hb-counter" id="hb-children-counter">
            <h4 class="hb-title">
              <label for="hb-children">Deti</label>
            </h4>

            <div class="hb-counter-inner">
              <button class="hb-count-button" type="button" data-counter="children" data-direction="remove">-</button>

              <input
                class="hb-count-field"
                id="hb-children"
                autocomplete="off"
                type="number"
                name="children"
                readonly
              />

              <button class="hb-count-button" type="button" data-counter="children" data-direction="add">+</button>
            </div>
          </div>

          <div class="hb-selects" id="hb-child-selects">
            <div class="hb-select-group" id="hb-group-child1">
              <h4 class="hb-title"><label for="hb-child1">Dieťa 1</label></h4>
              <select class="hb-select" name="child1" id="hb-child1" data-child="1">
                <option value="0">Vek dieťaťa</option>
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option><option value="11">11</option><option value="12">12</option>
              </select>
            </div>

            <div class="hb-select-group" id="hb-group-child2">
              <h4 class="hb-title"><label for="hb-child2">Dieťa 2</label></h4>
              <select class="hb-select" name="child2" id="hb-child2" data-child="2">
                <option value="0">Vek dieťaťa</option>
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option><option value="11">11</option><option value="12">12</option>
              </select>
            </div>

            <div class="hb-select-group" id="hb-group-child3">
              <h4 class="hb-title"><label for="hb-child3">Dieťa 3</label></h4>
              <select class="hb-select" name="child3" id="hb-child3" data-child="3">
                <option value="0">Vek dieťaťa</option>
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option><option value="11">11</option><option value="12">12</option>
              </select>
            </div>

            <div class="hb-select-group" id="hb-group-child4">
              <h4 class="hb-title"><label for="hb-child4">Dieťa 4</label></h4>
              <select class="hb-select" name="child4" id="hb-child4" data-child="4">
                <option value="0">Vek dieťaťa</option>
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option><option value="11">11</option><option value="12">12</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="hb-block hb-submit-block">
        <input
          id="hb-book"
          type="button"
          class="hb-submit-button"
          value="Overiť dostupnosť"
        />
      </div>
    </form>

    <div class="hb-warning" id="hb-error-msg" aria-live="polite"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pikaday/pikaday.js"></script>

  <script>
    (function () {
      "use strict";

      function sendHeight() {
        const height = Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight,
          120
        );

        parent.postMessage(
          {
            type: "hotelBookingWidgetHeight",
            height: height + 20
          },
          "*"
        );
      }

      window.addEventListener("load", sendHeight);
      window.addEventListener("resize", sendHeight);

      const widget = document.getElementById("hotel-booking-widget");
      if (!widget) return;

      const hotelID = "51";
      const apiURL =
        "https://api.softsolutions.sk/booking/quickbooker/getBookingOfferPage/";
      const apiCall = apiURL + hotelID;

      const minChildren = 0;
      const minAdults = 1;
      const maxChildren = 4;
      const maxAdults = 6;

      const buttonDefaultText = "Overiť dostupnosť";
      const buttonLoadingText = "Otváram...";

      const msgNoAgeOfChildren = "Nie je vyplnený vek detí!";
      const msgMissingDates = "Vyberte dátum príchodu a dátum odchodu.";
      const msgBookingError =
        "Rezerváciu sa nepodarilo otvoriť. Skúste to prosím znova.";

      let dateFrom = null;
      let dateTo = null;
      let numberOfAdults = 1;
      let numberOfChildren = 0;

      const ageOfChildren = {
        child1: 0,
        child2: 0,
        child3: 0,
        child4: 0
      };

      const childGroups = [
        "hb-group-child1",
        "hb-group-child2",
        "hb-group-child3",
        "hb-group-child4"
      ];

      const els = {
        dateFrom: widget.querySelector("#hb-date-from"),
        dateTo: widget.querySelector("#hb-date-to"),
        adults: widget.querySelector("#hb-adults"),
        children: widget.querySelector("#hb-children"),
        childSelects: widget.querySelector("#hb-child-selects"),
        error: widget.querySelector("#hb-error-msg"),
        bookButton: widget.querySelector("#hb-book"),
        counterButtons: widget.querySelectorAll("[data-counter][data-direction]"),
        childAgeSelects: widget.querySelectorAll("[data-child]"),
        childrenCounter: widget.querySelector("#hb-children-counter")
      };

      const pikadaySK = {
        previousMonth: "Predchádzajúci Mesiac",
        nextMonth: "Ďalší Mesiac",
        months: [
          "Január", "Február", "Marec", "Apríl", "Máj", "Jún",
          "Júl", "August", "September", "Október", "November", "December"
        ],
        weekdays: [
          "Nedeľa", "Pondelok", "Utorok", "Streda", "Štvrtok", "Piatok", "Sobota"
        ],
        weekdaysShort: ["Ne", "Po", "Ut", "St", "Št", "Pi", "So"]
      };

      function setError(message) {
        els.error.textContent = message || "";
        sendHeight();
      }

      function removeError() {
        els.error.textContent = "";
        sendHeight();
      }

      function addDays(baseDate, days) {
        const date = new Date(baseDate.getTime());
        date.setDate(date.getDate() + days);
        return date;
      }

      function dateToString(date) {
        return date.getDate() + "." + (date.getMonth() + 1) + "." + date.getFullYear();
      }

      function dateFromString(dateString) {
        const parts = dateString.split(".");
        return new Date(
          parseInt(parts[2], 10),
          parseInt(parts[1], 10) - 1,
          parseInt(parts[0], 10)
        );
      }

      function formatDate(dateString) {
        if (!dateString) return "";

        const parts = dateString.split(".");
        let day = parseInt(parts[0], 10);
        let month = parseInt(parts[1], 10);
        const year = parseInt(parts[2], 10);

        if (day < 10) day = "0" + day;
        if (month < 10) month = "0" + month;

        return year + "-" + month + "-" + day;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const tomorrow = addDays(today, 1);
      const nextDay = addDays(today, 2);

      const basePikadayOptions = {
        firstDay: 1,
        format: "DD.MM.YYYY",
        numberOfMonths: 1,
        i18n: pikadaySK,
        theme: "hotel-booking-pika",
        toString: dateToString,
        parse: dateFromString
      };

      const dateFromPicker = new Pikaday(
        Object.assign({}, basePikadayOptions, {
          field: els.dateFrom,
          minDate: today,
          defaultDate: tomorrow,
          setDefaultDate: true,
          onSelect: setDateFrom
        })
      );

      const dateToPicker = new Pikaday(
        Object.assign({}, basePikadayOptions, {
          field: els.dateTo,
          minDate: tomorrow,
          defaultDate: nextDay,
          setDefaultDate: true,
          onSelect: setDateTo
        })
      );

      function setDateFrom() {
        removeError();

        dateFrom = els.dateFrom.value;

        const selectedDateFrom = dateFromPicker.getDate();
        if (!selectedDateFrom) return;

        const minDateTo = addDays(selectedDateFrom, 1);
        dateToPicker.setMinDate(minDateTo);

        const selectedDateTo = dateToPicker.getDate();

        if (!selectedDateTo || selectedDateFrom >= selectedDateTo) {
          dateToPicker.setDate(minDateTo);
        }

        setDateTo();
      }

      function setDateTo() {
        removeError();
        dateTo = els.dateTo.value;
      }

      function updateChildAgeFields() {
        childGroups.forEach(function (groupId, index) {
          const group = document.getElementById(groupId);
          if (!group) return;

          if (index < numberOfChildren) {
            group.style.display = "block";
          } else {
            group.style.display = "none";

            const childNumber = index + 1;
            const childKey = "child" + childNumber;
            const select = document.getElementById("hb-" + childKey);

            ageOfChildren[childKey] = 0;
            if (select) select.value = "0";
          }
        });

        sendHeight();
      }

      function showChildSelects() {
        if (numberOfChildren > 0) {
          els.childSelects.style.display = "block";
          updateChildAgeFields();
          sendHeight();
        }
      }

      function hideChildSelects() {
        els.childSelects.style.display = "none";
        sendHeight();
      }

      function setCounterValue(type, value) {
        if (type === "adults") {
          numberOfAdults = Math.max(minAdults, Math.min(maxAdults, value));
          els.adults.value = numberOfAdults;
        }

        if (type === "children") {
          numberOfChildren = Math.max(minChildren, Math.min(maxChildren, value));
          els.children.value = numberOfChildren;
          updateChildAgeFields();

          if (numberOfChildren > 0) {
            showChildSelects();
          } else {
            hideChildSelects();
          }
        }
      }

      function changeValue(type, direction) {
        removeError();

        const currentValue = type === "adults" ? numberOfAdults : numberOfChildren;
        const newValue = direction === "add" ? currentValue + 1 : currentValue - 1;

        setCounterValue(type, newValue);
      }

      function hasMissingChildAge() {
        if (numberOfChildren < 1) return false;

        for (let i = 1; i <= numberOfChildren; i++) {
          const key = "child" + i;

          if (!ageOfChildren[key] || Number(ageOfChildren[key]) === 0) {
            return true;
          }
        }

        return false;
      }

      function isEnglishSite() {
        try {
          return window.parent.location.href.indexOf("//en.") !== -1;
        } catch (e) {
          return false;
        }
      }

      function buildBookingPayload() {
        const params = new URLSearchParams();

        params.append("dateFrom", formatDate(dateFrom));
        params.append("dateTo", formatDate(dateTo));
        params.append("1_adultCount", String(numberOfAdults));

        if (numberOfChildren > 0) {
          params.append("1_childCount", String(numberOfChildren));
          params.append("1_child1", String(ageOfChildren.child1 || 0));
          params.append("1_child2", String(ageOfChildren.child2 || 0));
          params.append("1_child3", String(ageOfChildren.child3 || 0));
          params.append("1_child4", String(ageOfChildren.child4 || 0));
        }

        if (isEnglishSite()) {
          params.append("lang", "en");
        }

        return params.toString();
      }

      function setSubmitting(isSubmitting) {
        els.bookButton.disabled = isSubmitting;
        els.bookButton.value = isSubmitting ? buttonLoadingText : buttonDefaultText;
      }

      function sendForm() {
        removeError();
        setDateFrom();
        setDateTo();

        if (!dateFrom || !dateTo || !numberOfAdults) {
          setError(msgMissingDates);
          return;
        }

        if (hasMissingChildAge()) {
          setError(msgNoAgeOfChildren);
          showChildSelects();
          return;
        }

        const payload = buildBookingPayload();
        const windowReference = window.open("", "_blank");

        setSubmitting(true);

        fetch(apiCall, {
          method: "POST",
          body: payload,
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          }
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("Booking API returned HTTP " + response.status);
            }

            return response.json();
          })
          .then(function (result) {
            const redirectUrl =
              result && result.data && result.data.url ? result.data.url : null;

            if (!redirectUrl) {
              throw new Error("Booking API did not return redirect URL.");
            }

            if (windowReference) {
              windowReference.location = redirectUrl;
            } else {
              window.location.href = redirectUrl;
            }
          })
          .catch(function (error) {
            console.error("Booking widget error:", error);

            if (windowReference && !windowReference.closed) {
              windowReference.close();
            }

            setError(msgBookingError);
          })
          .finally(function () {
            setSubmitting(false);
            hideChildSelects();
          });
      }

      els.counterButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          changeValue(
            button.getAttribute("data-counter"),
            button.getAttribute("data-direction")
          );
        });
      });

      els.childAgeSelects.forEach(function (select) {
        select.addEventListener("change", function () {
          removeError();

          const childNumber = select.getAttribute("data-child");
          ageOfChildren["child" + childNumber] = select.value;
        });
      });

      els.bookButton.addEventListener("click", sendForm);

      els.dateFrom.addEventListener("keydown", function (event) {
        event.preventDefault();
      });

      els.dateTo.addEventListener("keydown", function (event) {
        event.preventDefault();
      });

      els.dateFrom.addEventListener("blur", setDateFrom);
      els.dateTo.addEventListener("blur", setDateTo);

      els.childrenCounter.addEventListener("mouseenter", showChildSelects);
      els.childSelects.addEventListener("mouseenter", showChildSelects);

      document.addEventListener("click", function (event) {
        const clickedInsideWidget = widget.contains(event.target);

        if (!clickedInsideWidget) {
          hideChildSelects();
        }
      });

      function init() {
        els.adults.min = minAdults;
        els.adults.max = maxAdults;
        els.adults.value = numberOfAdults;

        els.children.min = minChildren;
        els.children.max = maxChildren;
        els.children.value = numberOfChildren;

        els.bookButton.value = buttonDefaultText;

        setDateFrom();
        setDateTo();
        updateChildAgeFields();
        sendHeight();
      }

      init();
    })();
  </script>
</body>
</html>
