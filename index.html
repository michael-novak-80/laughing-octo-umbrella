<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: #000000;
      overflow: hidden;
      font-family: "Baskerville Display PT", Baskerville, "Libre Baskerville", Georgia, serif;
    }

    #hotel-booking-widget,
    #hotel-booking-widget * {
      box-sizing: border-box;
    }

    #hotel-booking-widget {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 0;
      background: transparent;
      color: #000000;
      border: none;
      box-shadow: none;
    }

    #hotel-booking-widget input,
    #hotel-booking-widget button {
      font-family: "Baskerville Display PT", Baskerville, "Libre Baskerville", Georgia, serif !important;
    }

    #hotel-booking-widget .hb-form {
      display: grid;
      grid-template-columns: 1.25fr 1.25fr 0.7fr 0.7fr auto;
      gap: 26px;
      align-items: end;
      width: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: visible;
    }

    #hotel-booking-widget .hb-group {
      position: relative;
      margin: 0;
      padding: 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    #hotel-booking-widget .hb-title {
      margin: 0 0 8px 0 !important;
      padding: 0 !important;
      text-align: left;
      font-size: 1em;
      line-height: 1.2;
      font-weight: 400;
      color: #000000;
    }

    #hotel-booking-widget .hb-date-field {
      width: 100% !important;
      height: 36px !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
      border-bottom: 1.5px solid #000000 !important;
      border-radius: 0 !important;
      background: transparent !important;
      color: #000000 !important;
      font-size: 1em !important;
      line-height: 36px !important;
      font-weight: 400 !important;
      text-align: left;
      cursor: pointer;
      box-shadow: none !important;
      outline: none !important;
      appearance: auto;
      -webkit-appearance: auto;
    }

    #hotel-booking-widget .hb-date-field::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.75;
    }

    #hotel-booking-widget .hb-counter-inner {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      height: 36px;
      border-bottom: 1.5px solid #000000;
      background: transparent;
    }

    #hotel-booking-widget .hb-count-button {
      width: auto !important;
      height: 36px !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      background: transparent !important;
      color: #000000 !important;
      font-size: 1em !important;
      font-weight: 400 !important;
      line-height: 36px !important;
      text-align: center !important;
      cursor: pointer;
      box-shadow: none !important;
      outline: none !important;
    }

    #hotel-booking-widget .hb-count-button:hover {
      opacity: 0.55;
    }

    #hotel-booking-widget .hb-count-field {
      width: 100%;
      height: 36px;
      padding: 0;
      margin: 0;
      border: none;
      background: transparent;
      color: #000000;
      font-size: 1em;
      font-weight: 400;
      line-height: 36px;
      text-align: center;
      box-shadow: none;
      outline: none;
    }

    #hotel-booking-widget .hb-submit-block {
      margin: 0;
      padding: 0;
      align-self: end;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    #hotel-booking-widget .hb-submit-button {
      min-width: 210px !important;
      height: 44px !important;
      padding: 0 24px !important;
      margin: 0 !important;
      border: 1.5px solid #000000 !important;
      border-radius: 0 !important;
      background: transparent !important;
      color: #000000 !important;
      font-size: 1em !important;
      font-weight: 400 !important;
      letter-spacing: 0 !important;
      text-transform: none !important;
      line-height: 42px !important;
      text-align: center !important;
      cursor: pointer;
      box-shadow: none !important;
      outline: none !important;
      appearance: none !important;
      -webkit-appearance: none !important;
    }

    #hotel-booking-widget .hb-submit-button:hover {
      background: #000000 !important;
      color: #FEFAF1 !important;
      border-color: #000000 !important;
    }

    #hotel-booking-widget .hb-submit-button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    #hotel-booking-widget .hb-warning {
      position: absolute;
      left: 0;
      top: 78px;
      color: #9f1d1d;
      font-weight: 400;
      font-size: 0.9em;
      line-height: 1.2;
    }

    #hotel-booking-widget .hb-children-group {
      position: relative;
      z-index: 20;
    }

    #hotel-booking-widget .hb-child-panel {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 9999;
      width: 460px;
      padding: 9px 10px;
      background: #FEFAF1;
      border: 1.5px solid #000000;
      color: #000000;
    }

    #hotel-booking-widget .hb-child-panel-title {
      margin: 0 0 7px 0;
      padding: 0;
      font-size: 0.85em;
      line-height: 1.1;
      font-weight: 400;
      white-space: nowrap;
    }

    #hotel-booking-widget .hb-child-inputs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
    }

    #hotel-booking-widget .hb-child-age {
      display: none;
      width: 100%;
      height: 30px;
      padding: 0 8px !important;
      border: none !important;
      border-bottom: 1.5px solid #000000 !important;
      border-radius: 0 !important;
      background: transparent !important;
      color: #000000 !important;
      font-size: 0.9em !important;
      line-height: 30px !important;
      font-weight: 400 !important;
      text-align: center;
      outline: none !important;
      box-shadow: none !important;
      appearance: textfield;
      -moz-appearance: textfield;
    }

    #hotel-booking-widget .hb-child-age::placeholder {
      color: #000000;
      opacity: 0.7;
    }

    #hotel-booking-widget input::-webkit-outer-spin-button,
    #hotel-booking-widget input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    #hotel-booking-widget input[type="number"] {
      -moz-appearance: textfield;
    }

    @media only screen and (max-width: 1100px) {
      html,
      body {
        overflow: auto;
      }

      #hotel-booking-widget .hb-form {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      #hotel-booking-widget .hb-submit-block {
        grid-column: 1 / -1;
      }

      #hotel-booking-widget .hb-submit-button {
        width: 100% !important;
      }

      #hotel-booking-widget .hb-child-panel {
        position: static;
        width: 100%;
        margin-top: 12px;
      }
    }

    @media only screen and (max-width: 640px) {
      html,
      body {
        overflow: auto;
      }

      #hotel-booking-widget .hb-form {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      #hotel-booking-widget .hb-submit-button {
        width: 100% !important;
      }

      #hotel-booking-widget .hb-child-inputs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <div id="hotel-booking-widget">
    <form class="hb-form" id="hotel-booking-form" novalidate>
      <div class="hb-group">
        <h4 class="hb-title">
          <label for="hb-date-from">Dátum príchodu</label>
        </h4>

        <input
          class="hb-date-field"
          type="date"
          autocomplete="off"
          id="hb-date-from"
          name="dateFrom"
        />
      </div>

      <div class="hb-group">
        <h4 class="hb-title">
          <label for="hb-date-to">Dátum odchodu</label>
        </h4>

        <input
          class="hb-date-field"
          type="date"
          autocomplete="off"
          id="hb-date-to"
          name="dateTo"
        />
      </div>

      <div class="hb-group">
        <h4 class="hb-title">
          <label for="hb-adults">Dospelí</label>
        </h4>

        <div class="hb-counter-inner">
          <button
            class="hb-count-button"
            type="button"
            data-counter="adults"
            data-direction="remove"
            aria-label="Znížiť počet dospelých"
          >
            -
          </button>

          <input
            class="hb-count-field"
            id="hb-adults"
            autocomplete="off"
            type="number"
            name="adults"
            readonly
            aria-label="Počet dospelých"
          />

          <button
            class="hb-count-button"
            type="button"
            data-counter="adults"
            data-direction="add"
            aria-label="Zvýšiť počet dospelých"
          >
            +
          </button>
        </div>
      </div>

      <div class="hb-group hb-children-group">
        <h4 class="hb-title">
          <label for="hb-children">Deti</label>
        </h4>

        <div class="hb-counter-inner">
          <button
            class="hb-count-button"
            type="button"
            data-counter="children"
            data-direction="remove"
            aria-label="Znížiť počet detí"
          >
            -
          </button>

          <input
            class="hb-count-field"
            id="hb-children"
            autocomplete="off"
            type="number"
            name="children"
            readonly
            aria-label="Počet detí"
          />

          <button
            class="hb-count-button"
            type="button"
            data-counter="children"
            data-direction="add"
            aria-label="Zvýšiť počet detí"
          >
            +
          </button>
        </div>

        <div class="hb-child-panel" id="hb-child-panel">
          <div class="hb-child-panel-title">Vek detí</div>

          <div class="hb-child-inputs">
            <input
              class="hb-child-age"
              id="hb-child-age-1"
              type="number"
              inputmode="numeric"
              min="1"
              max="12"
              placeholder="Dieťa 1"
              data-child-age="1"
            />

            <input
              class="hb-child-age"
              id="hb-child-age-2"
              type="number"
              inputmode="numeric"
              min="1"
              max="12"
              placeholder="Dieťa 2"
              data-child-age="2"
            />

            <input
              class="hb-child-age"
              id="hb-child-age-3"
              type="number"
              inputmode="numeric"
              min="1"
              max="12"
              placeholder="Dieťa 3"
              data-child-age="3"
            />

            <input
              class="hb-child-age"
              id="hb-child-age-4"
              type="number"
              inputmode="numeric"
              min="1"
              max="12"
              placeholder="Dieťa 4"
              data-child-age="4"
            />
          </div>
        </div>
      </div>

      <div class="hb-submit-block">
        <input
          id="hb-book"
          type="button"
          class="hb-submit-button"
          value="Overiť dostupnosť"
        />
      </div>
    </form>

    <div class="hb-warning" id="hb-error-msg" aria-live="polite"></div>
  </div>

  <script>
    (function () {
      "use strict";

      const widget = document.getElementById("hotel-booking-widget");
      if (!widget) return;

      const hotelID = "51";
      const apiURL =
        "https://api.softsolutions.sk/booking/quickbooker/getBookingOfferPage/";
      const apiCall = apiURL + hotelID;

      const minChildren = 0;
      const minAdults = 1;
      const maxChildren = 4;
      const maxAdults = 6;

      const buttonDefaultText = "Overiť dostupnosť";
      const buttonLoadingText = "Otváram...";

      const msgNoAgeOfChildren = "Vyplňte vek detí.";
      const msgInvalidChildAge = "Vek dieťaťa musí byť od 1 do 12 rokov.";
      const msgMissingDates = "Vyberte dátum príchodu a dátum odchodu.";
      const msgBookingError =
        "Rezerváciu sa nepodarilo otvoriť. Skúste to prosím znova.";

      let numberOfAdults = 1;
      let numberOfChildren = 0;

      const ageOfChildren = {
        child1: 0,
        child2: 0,
        child3: 0,
        child4: 0,
      };

      const els = {
        dateFrom: widget.querySelector("#hb-date-from"),
        dateTo: widget.querySelector("#hb-date-to"),
        adults: widget.querySelector("#hb-adults"),
        children: widget.querySelector("#hb-children"),
        childPanel: widget.querySelector("#hb-child-panel"),
        error: widget.querySelector("#hb-error-msg"),
        bookButton: widget.querySelector("#hb-book"),
        counterButtons: widget.querySelectorAll("[data-counter][data-direction]"),
        childAgeInputs: widget.querySelectorAll("[data-child-age]"),
      };

      function setError(message) {
        els.error.textContent = message || "";
      }

      function removeError() {
        els.error.textContent = "";
      }

      function addDays(baseDate, days) {
        const date = new Date(baseDate.getTime());
        date.setDate(date.getDate() + days);
        return date;
      }

      function dateToISO(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return year + "-" + month + "-" + day;
      }

      function setDefaultDates() {
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const tomorrow = addDays(today, 1);
        const nextDay = addDays(today, 2);

        els.dateFrom.min = dateToISO(today);
        els.dateFrom.value = dateToISO(tomorrow);

        els.dateTo.min = dateToISO(tomorrow);
        els.dateTo.value = dateToISO(nextDay);
      }

      function updateDateLimits() {
        const fromValue = els.dateFrom.value;
        if (!fromValue) return;

        const fromDate = new Date(fromValue + "T00:00:00");
        const minToDate = addDays(fromDate, 1);
        const minTo = dateToISO(minToDate);

        els.dateTo.min = minTo;

        if (!els.dateTo.value || els.dateTo.value <= fromValue) {
          els.dateTo.value = minTo;
        }
      }

      function normalizeChildAge(input) {
        let value = parseInt(input.value, 10);

        if (Number.isNaN(value)) {
          input.value = "";
          return 0;
        }

        if (value < 1) value = 1;
        if (value > 12) value = 12;

        input.value = String(value);
        return value;
      }

      function updateChildAgeFields() {
        if (numberOfChildren > 0) {
          els.childPanel.style.display = "block";
        } else {
          els.childPanel.style.display = "none";
        }

        els.childAgeInputs.forEach(function (input, index) {
          const childNumber = index + 1;
          const childKey = "child" + childNumber;

          if (index < numberOfChildren) {
            input.style.display = "block";
          } else {
            input.style.display = "none";
            input.value = "";
            ageOfChildren[childKey] = 0;
          }
        });
      }

      function setCounterValue(type, value) {
        if (type === "adults") {
          numberOfAdults = Math.max(minAdults, Math.min(maxAdults, value));
          els.adults.value = numberOfAdults;
        }

        if (type === "children") {
          numberOfChildren = Math.max(minChildren, Math.min(maxChildren, value));
          els.children.value = numberOfChildren;
          updateChildAgeFields();
        }
      }

      function changeValue(type, direction) {
        removeError();

        const currentValue =
          type === "adults" ? numberOfAdults : numberOfChildren;

        const newValue =
          direction === "add" ? currentValue + 1 : currentValue - 1;

        setCounterValue(type, newValue);
      }

      function readChildAges() {
        els.childAgeInputs.forEach(function (input) {
          const childNumber = input.getAttribute("data-child-age");
          const childKey = "child" + childNumber;

          if (Number(childNumber) <= numberOfChildren) {
            ageOfChildren[childKey] = normalizeChildAge(input);
          } else {
            ageOfChildren[childKey] = 0;
          }
        });
      }

      function hasMissingChildAge() {
        if (numberOfChildren < 1) return false;

        readChildAges();

        for (let i = 1; i <= numberOfChildren; i++) {
          const key = "child" + i;

          if (!ageOfChildren[key] || Number(ageOfChildren[key]) === 0) {
            return true;
          }

          if (Number(ageOfChildren[key]) < 1 || Number(ageOfChildren[key]) > 12) {
            setError(msgInvalidChildAge);
            return true;
          }
        }

        return false;
      }

      function buildBookingPayload() {
        const params = new URLSearchParams();

        params.append("dateFrom", els.dateFrom.value);
        params.append("dateTo", els.dateTo.value);
        params.append("1_adultCount", String(numberOfAdults));

        if (numberOfChildren > 0) {
          params.append("1_childCount", String(numberOfChildren));
          params.append("1_child1", String(ageOfChildren.child1 || 0));
          params.append("1_child2", String(ageOfChildren.child2 || 0));
          params.append("1_child3", String(ageOfChildren.child3 || 0));
          params.append("1_child4", String(ageOfChildren.child4 || 0));
        }

        return params.toString();
      }

      function setSubmitting(isSubmitting) {
        els.bookButton.disabled = isSubmitting;
        els.bookButton.value = isSubmitting ? buttonLoadingText : buttonDefaultText;
      }

      function sendForm() {
        removeError();
        updateDateLimits();

        if (!els.dateFrom.value || !els.dateTo.value || !numberOfAdults) {
          setError(msgMissingDates);
          return;
        }

        if (hasMissingChildAge()) {
          if (!els.error.textContent) {
            setError(msgNoAgeOfChildren);
          }
          return;
        }

        const payload = buildBookingPayload();
        const windowReference = window.open("", "_blank");

        setSubmitting(true);

        fetch(apiCall, {
          method: "POST",
          body: payload,
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
          },
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("Booking API returned HTTP " + response.status);
            }

            return response.json();
          })
          .then(function (result) {
            const redirectUrl =
              result && result.data && result.data.url ? result.data.url : null;

            if (!redirectUrl) {
              throw new Error("Booking API did not return redirect URL.");
            }

            if (windowReference) {
              windowReference.location = redirectUrl;
            } else {
              window.location.href = redirectUrl;
            }
          })
          .catch(function (error) {
            console.error("Booking widget error:", error);

            if (windowReference && !windowReference.closed) {
              windowReference.close();
            }

            setError(msgBookingError);
          })
          .finally(function () {
            setSubmitting(false);
          });
      }

      function bindEvents() {
        els.counterButtons.forEach(function (button) {
          button.addEventListener("click", function () {
            changeValue(
              button.getAttribute("data-counter"),
              button.getAttribute("data-direction")
            );
          });
        });

        els.childAgeInputs.forEach(function (input) {
          input.addEventListener("input", function () {
            removeError();
            readChildAges();
          });

          input.addEventListener("blur", function () {
            readChildAges();
          });
        });

        els.dateFrom.addEventListener("change", function () {
          removeError();
          updateDateLimits();
        });

        els.dateTo.addEventListener("change", function () {
          removeError();
        });

        els.bookButton.addEventListener("click", function () {
          sendForm();
        });
      }

      function init() {
        setDefaultDates();

        els.adults.min = minAdults;
        els.adults.max = maxAdults;
        els.adults.value = numberOfAdults;

        els.children.min = minChildren;
        els.children.max = maxChildren;
        els.children.value = numberOfChildren;

        els.bookButton.value = buttonDefaultText;

        updateChildAgeFields();
        bindEvents();
      }

      init();
    })();
  </script>
</body>
</html>
